<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>棚スキャナー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<style>
/* Layout: the camera fills the screen; a bottom sheet holds the samples and controls. */
:root {
  --ink: #f2f5f3;
  --muted: #a7b3ae;
  --sheet: rgba(14, 20, 18, .88);
  --line: rgba(255,255,255,.16);
  --accent: #4fc2a6;
  --mark: #ffd21f;
  --bad: #ff8a8a;
  --font: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: var(--font); overflow: hidden; }
#stage { position: fixed; inset: 0; }
video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
video { object-fit: cover; }
#overlay { pointer-events: none; }

.top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
  background: linear-gradient(rgba(0,0,0,.6), transparent); }
.brand { font-weight: 900; font-size: 18px; letter-spacing: .04em; }
.brand span { color: var(--mark); }
#meter { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
#meter b { color: var(--ink); font-weight: 500; }

#guide { position: absolute; border: 2px dashed rgba(255,255,255,.8); border-radius: 12px; pointer-events: none; }
#guide span { position: absolute; left: 50%; top: -28px; transform: translateX(-50%); white-space: nowrap; font-size: 13px; background: rgba(0,0,0,.55); padding: 2px 10px; border-radius: 999px; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--sheet); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
  padding: 12px max(14px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(14px, env(safe-area-inset-left, 0px));
  display: grid; gap: 10px; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.refs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.ref { position: relative; flex: none; width: 56px; height: 56px; border-radius: 10px; overflow: hidden; border: 2px solid var(--line); background: #222; }
.ref img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ref button { position: absolute; top: 0; right: 0; width: 22px; height: 22px; border: 0; border-radius: 0 0 0 8px; background: rgba(0,0,0,.7); color: #fff; font-size: 14px; line-height: 1; cursor: pointer; }
.add { flex: none; width: 56px; height: 56px; border-radius: 10px; border: 2px dashed var(--line); display: grid; place-items: center; text-align: center; font-size: 10px; color: var(--muted); position: relative; cursor: pointer; }
.add input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 700; font-size: 15px; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; color: #08201a; background: var(--accent); }
.btn.alt { background: rgba(255,255,255,.12); color: var(--ink); }
.btn.big { flex: 1; font-size: 17px; padding: 14px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, input:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.slider { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 180px; font-size: 13px; color: var(--muted); }
.slider input { flex: 1; accent-color: var(--mark); }
.slider output { font-family: var(--mono); color: var(--ink); width: 3ch; text-align: right; }
.toggle { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
#msg { font-size: 13px; color: var(--muted); margin: 0; }
#msg.err { color: var(--bad); }

#start { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: #0e1412; text-align: center; z-index: 5; }
#start h1 { font-size: 30px; font-weight: 900; margin: 0 0 8px; }
#start h1 span { color: var(--mark); }
#start p { color: var(--muted); max-width: 32em; line-height: 1.7; margin: 0 auto 20px; font-size: 14px; }
#start ol { text-align: left; color: var(--muted); font-size: 14px; line-height: 1.8; max-width: 26em; margin: 0 auto 24px; padding-left: 1.4em; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="guide" hidden><span>見本をこの枠に入れる</span></div>
</div>

<div class="top">
  <div class="brand">棚<span>スキャナー</span></div>
  <div id="meter"></div>
</div>

<div class="sheet">
  <div class="label">探す商品の見本</div>
  <div class="refs" id="refs">
    <label class="add" title="写真から見本を追加">写真から<br>追加<input id="file" type="file" accept="image/*" multiple></label>
  </div>
  <div class="row">
    <button class="btn alt" id="capture" type="button">枠の中を見本にする</button>
    <button class="btn big" id="scan" type="button" disabled>探す</button>
  </div>
  <div class="row">
    <label class="slider">感度
      <input id="sens" type="range" min="1" max="10" value="5">
      <output id="sensOut">5</output>
    </label>
    <label class="toggle"><input id="sound" type="checkbox" checked>音（ピピピピ）</label>
  </div>
  <p id="msg">準備中…</p>
</div>

<div id="start">
  <div>
    <h1>棚<span>スキャナー</span></h1>
    <p>カメラを売り場に向けて動かすと、見本に似た商品が映ったときに、その場所が黄色く点滅して音でお知らせします。</p>
    <ol>
      <li>探したい商品の見本を登録する（実物や商品ページの画像を枠に入れて撮る、または写真を選ぶ）</li>
      <li>「探す」を押して、棚にゆっくりカメラを向ける</li>
      <li>点滅したところを目で確かめる</li>
    </ol>
    <button class="btn big" id="go" type="button" style="max-width:320px;width:100%">カメラを起動</button>
    <p id="startMsg" style="margin-top:14px"></p>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const video = $("video"), overlay = $("overlay"), octx = overlay.getContext("2d");
  const KEY = "shelf-scanner-refs-v1";
  const SIZE = 224;
  let model = null, refs = [], refEmb = null, scanning = false, busy = false;
  let detections = [], lastAlert = 0, audio = null, scaleIdx = 0;
  const scaleScores = [];   // last result per scale: {boxes, sims}

  const msg = (t, err) => { $("msg").textContent = t; $("msg").classList.toggle("err", !!err); };

  // ---------- storage ----------
  function saveRefs() { try { localStorage.setItem(KEY, JSON.stringify(refs.map((r) => r.url))); } catch {} }
  function loadRefURLs() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }

  // ---------- model ----------
  async function loadModel() {
    msg("画像認識モデルを読み込み中…（初回は数秒〜20秒）");
    await tf.ready();
    model = await mobilenet.load({ version: 2, alpha: 1.0 });
    tf.tidy(() => model.infer(tf.zeros([1, SIZE, SIZE, 3]), true));   // warm up
  }

  // Embed a batch [N,224,224,3] (0-255) -> L2-normalized [N,D]
  function embed(batch) {
    const n = batch.shape[0];
    const e = model.infer(batch, true).reshape([n, -1]);
    return e.div(e.norm("euclidean", 1, true).add(1e-6));
  }

  // ---------- samples ----------
  function imgFromURL(url) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }); }
  function squareURL(source, sx, sy, sw, sh) {
    const c = document.createElement("canvas"); c.width = c.height = SIZE;
    c.getContext("2d").drawImage(source, sx, sy, sw, sh, 0, 0, SIZE, SIZE);
    return c.toDataURL("image/jpeg", 0.88);
  }
  async function addRef(url) {
    if (refs.length >= 8) { msg("見本は8枚までです。不要なものを × で外してください。", true); return; }
    refs.push({ url }); saveRefs(); renderRefs(); await rebuildRefEmb();
  }
  function renderRefs() {
    const box = $("refs");
    box.querySelectorAll(".ref").forEach((n) => n.remove());
    refs.forEach((r, i) => {
      const d = document.createElement("div"); d.className = "ref";
      const im = document.createElement("img"); im.src = r.url; im.alt = "見本 " + (i + 1);
      const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.title = "この見本を外す";
      x.onclick = async () => { refs.splice(i, 1); saveRefs(); renderRefs(); await rebuildRefEmb(); };
      d.append(im, x); box.insertBefore(d, box.querySelector(".add"));
    });
    $("scan").disabled = !refs.length || !model;
    if (!refs.length && scanning) toggleScan(false);
  }
  async function rebuildRefEmb() {
    if (refEmb) { refEmb.dispose(); refEmb = null; }
    if (!refs.length || !model) return;
    const imgs = await Promise.all(refs.map((r) => imgFromURL(r.url)));
    refEmb = tf.tidy(() => {
      const views = [];
      for (const im of imgs) {
        const t = tf.browser.fromPixels(im).toFloat().expandDims(0);
        const boxes = [[0, 0, 1, 1], [0.1, 0.1, 0.9, 0.9], [0.2, 0.2, 0.8, 0.8]];
        const crops = tf.image.cropAndResize(t, boxes, [0, 0, 0], [SIZE, SIZE]);
        views.push(crops, tf.reverse(crops, 2));   // + mirrored
      }
      return embed(tf.concat(views));
    });
    msg(scanning ? "スキャン中。棚にゆっくりカメラを向けてください。" : "見本 " + refs.length + " 枚。「探す」を押して棚に向けてください。");
  }
  $("file").onchange = async (e) => {
    for (const f of e.target.files) {
      const url = URL.createObjectURL(f);
      try {
        const im = await imgFromURL(url);
        const s = Math.min(im.naturalWidth, im.naturalHeight);
        await addRef(squareURL(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s));
      } catch { msg("この画像は読み込めませんでした。", true); }
      URL.revokeObjectURL(url);
    }
    e.target.value = "";
  };

  // ---------- geometry: video pixels <-> screen ----------
  function view() {
    const cw = overlay.clientWidth, ch = overlay.clientHeight, vw = video.videoWidth, vh = video.videoHeight;
    const k = Math.max(cw / vw, ch / vh);
    return { cw, ch, vw, vh, k, ox: (cw - vw * k) / 2, oy: (ch - vh * k) / 2 };
  }
  // guide square: centered in the visible area, 45% of the shorter visible side
  function guideRectVideo() {
    const v = view();
    const visW = v.cw / v.k, visH = v.ch / v.k;
    const s = Math.min(visW, visH) * 0.45;
    const cx = (v.cw / 2 - v.ox) / v.k, cy = (v.ch * 0.42 - v.oy) / v.k;
    return { x: cx - s / 2, y: cy - s / 2, s };
  }
  function placeGuide() {
    if (!video.videoWidth) return;
    const v = view(), g = guideRectVideo(), el = $("guide");
    Object.assign(el.style, { left: g.x * v.k + v.ox + "px", top: g.y * v.k + v.oy + "px", width: g.s * v.k + "px", height: g.s * v.k + "px" });
  }
  $("capture").onclick = async () => {
    if (!video.videoWidth) return;
    const g = guideRectVideo();
    await addRef(squareURL(video, g.x, g.y, g.s, g.s));
    flashGuide();
  };
  function flashGuide() { const el = $("guide"); el.style.borderColor = "var(--mark)"; setTimeout(() => (el.style.borderColor = ""), 300); }

  // ---------- scanning windows (only the visible part of the frame) ----------
  const SCALES = [0.5, 0.34, 0.22];
  function windowsFor(scale) {
    const v = view();
    const x0 = Math.max(0, -v.ox / v.k), y0 = Math.max(0, -v.oy / v.k);
    const sheetTop = document.querySelector(".sheet").getBoundingClientRect().top;   // skip what the panel hides
    const w = Math.min(v.vw, v.cw / v.k), h = Math.min(v.vh - y0, (sheetTop - v.oy) / v.k - y0);
    const s = Math.min(w, h) * scale, step = s * 0.5;
    const out = [];
    for (let y = y0; y + s <= y0 + h + 1; y += step)
      for (let x = x0; x + s <= x0 + w + 1; x += step)
        out.push([y / v.vh, x / v.vw, (y + s) / v.vh, (x + s) / v.vw]);   // tf order: y1,x1,y2,x2 normalized
    return out;
  }

  async function step() {
    if (!scanning) return;
    if (!busy && refEmb && video.readyState >= 2) {
      busy = true;
      const boxes = windowsFor(SCALES[scaleIdx]);
      const simT = tf.tidy(() => {
        const frame = tf.browser.fromPixels(video).toFloat().expandDims(0);
        const crops = tf.image.cropAndResize(frame, boxes, new Array(boxes.length).fill(0), [SIZE, SIZE]);
        return embed(crops).matMul(refEmb.transpose()).max(1);
      });
      const sims = await simT.array();
      simT.dispose();
      scaleScores[scaleIdx] = { boxes, sims };
      scaleIdx = (scaleIdx + 1) % SCALES.length;
      judge();
      busy = false;
    }
    setTimeout(step, 30);
  }

  // Sensitivity 1..10 -> how far above the rest of the scene a window must stand out
  function judge() {
    const all = [];
    for (const r of scaleScores) if (r) r.boxes.forEach((b, i) => all.push({ b, s: r.sims[i] }));
    if (!all.length) return;
    const mean = all.reduce((a, x) => a + x.s, 0) / all.length;
    const sd = Math.sqrt(all.reduce((a, x) => a + (x.s - mean) ** 2, 0) / all.length) || 1e-6;
    const sens = +$("sens").value;
    const zNeed = 3.4 - sens * 0.22;        // sens 5 -> z 2.3
    const absNeed = 0.945 - sens * 0.025;   // sens 5 -> 0.82 (tested: target ~0.95, best non-target ~0.75)
    const best = all.reduce((a, x) => (x.s > a.s ? x : a));    $("meter").innerHTML = "一致度 <b>" + Math.round(best.s * 100) + "</b> / 鳴る基準 " + Math.round(absNeed * 100);
    const hits = all.filter((x) => x.s >= absNeed && (x.s - mean) / sd >= zNeed).sort((a, b) => b.s - a.s);
    const kept = [];
    for (const h of hits) if (kept.every((k) => iou(k.b, h.b) < 0.25 && !inside(h.b, k.b) && !inside(k.b, h.b))) kept.push(h);
    const now = performance.now();
    for (const h of kept.slice(0, 3)) {
      const old = detections.find((d) => iou(d.b, h.b) > 0.3);
      if (old) { old.b = h.b; old.s = h.s; old.t = now; } else detections.push({ b: h.b, s: h.s, t: now, born: now });
    }
    if (kept.length) alertUser();
  }
  function iou(a, b) {
    const iy = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])), ix = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
    const inter = ix * iy, ua = (a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - inter;
    return inter / ua;
  }
  function inside(a, b) { return a[0] >= b[0] - 0.02 && a[1] >= b[1] - 0.02 && a[2] <= b[2] + 0.02 && a[3] <= b[3] + 0.02; }

  // "ピピピピ": 4 short beeps, repeated about once a second while something similar is on screen
  function beeps(count) {
    if (!audio) return;
    if (audio.state === "suspended") audio.resume();
    const t0 = audio.currentTime + 0.02;
    for (let i = 0; i < count; i++) {
      const t = t0 + i * 0.12;
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "square"; o.frequency.value = 2000;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.005);
      g.gain.setValueAtTime(0.35, t + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.08);
    }
  }
  function alertUser() {
    const now = performance.now();
    if (now - lastAlert < 1000 || !$("sound").checked) return;
    lastAlert = now;
    try { navigator.vibrate?.([60, 60, 60, 60, 60, 60, 60]); } catch {}
    beeps(4);
  }

  // ---------- drawing ----------
  function draw(now) {
    const dpr = window.devicePixelRatio || 1;
    if (overlay.width !== overlay.clientWidth * dpr) { overlay.width = overlay.clientWidth * dpr; overlay.height = overlay.clientHeight * dpr; }
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    octx.clearRect(0, 0, overlay.clientWidth, overlay.clientHeight);
    detections = detections.filter((d) => now - d.t < 1500);
    if (video.videoWidth) {
      const v = view();
      for (const d of detections) {
        const x = d.b[1] * v.vw * v.k + v.ox, y = d.b[0] * v.vh * v.k + v.oy;
        const w = (d.b[3] - d.b[1]) * v.vw * v.k, h = (d.b[2] - d.b[0]) * v.vh * v.k;
        const fade = 1 - (now - d.t) / 1500;
        const blink = 0.55 + 0.45 * Math.sin(now / 90);
        octx.globalAlpha = Math.max(0, fade) * blink;
        octx.fillStyle = "rgba(255,210,31,.28)"; octx.fillRect(x, y, w, h);
        octx.lineWidth = 5; octx.strokeStyle = "#ffd21f"; octx.strokeRect(x, y, w, h);
        octx.globalAlpha = Math.max(0, fade);
        octx.font = "700 14px 'IBM Plex Mono', monospace";
        const label = "似ている " + Math.round(d.s * 100);
        const tw = octx.measureText(label).width + 12;
        octx.fillStyle = "#ffd21f"; octx.fillRect(x, Math.max(0, y - 24), tw, 22);
        octx.fillStyle = "#1a1a00"; octx.fillText(label, x + 6, Math.max(16, y - 8));
      }
      octx.globalAlpha = 1;
    }
    requestAnimationFrame(draw);
  }

  // ---------- controls ----------
  function toggleScan(on) {
    scanning = on;
    $("scan").textContent = on ? "止める" : "探す";
    $("guide").hidden = on;
    $("capture").disabled = on;
    detections = []; scaleScores.length = 0; $("meter").textContent = "";
    msg(on ? "スキャン中。棚にゆっくりカメラを向けてください。" : "見本 " + refs.length + " 枚。「探す」を押して棚に向けてください。");
    if (on) step();
  }
  $("scan").onclick = () => toggleScan(!scanning);
  $("sound").onchange = () => { if ($("sound").checked) beeps(4); };   // test sound when turned on
  $("sens").oninput =() => ($("sensOut").value = $("sens").value);
  addEventListener("resize", placeGuide);

  $("go").onclick = async () => {
    $("go").disabled = true;
    // iPhone: let sound play even when the side switch is on silent (Safari 16.4+)
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {}
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); beeps(1); } catch {}
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } });
      video.srcObject = stream;
      await video.play();
    } catch (e) {
      $("go").disabled = false;
      $("startMsg").textContent = "カメラを起動できませんでした。ブラウザの設定でカメラを許可してください。（" + (e.name || e) + "）";
      return;
    }
    $("start").hidden = true;
    $("guide").hidden = false;
    video.addEventListener("loadedmetadata", placeGuide); placeGuide();
    requestAnimationFrame(draw);
    try {
      await loadModel();
      refs = loadRefURLs().map((url) => ({ url }));
      renderRefs(); await rebuildRefEmb();
      if (!refs.length) msg("まず見本を登録してください。実物や商品画像を点線の枠に入れて「枠の中を見本にする」。");
    } catch (e) {
      msg("画像認識モデルを読み込めませんでした。通信状況を確認して再読み込みしてください。", true);
    }
  };
})();
</script>
</body>
</html>
